[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
# Match the compatibility target of the retained upstream source modules.
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "I", "UP", "B", "C4", "RET", "RUF"]
ignore = ["B905", "RUF005", "RUF007", "RUF022"]

[tool.mypy]
files = ["src/tradearena/core", "src/tradearena/evaluation"]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
